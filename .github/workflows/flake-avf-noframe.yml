name: Scratch AVF no-frame A/B

on:
  push:
    branches: [ci/flake-avf-noframe]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CAP_VERIFY_CARGO_PROFILE: ci-verify
  CAP_VERIFY_NEXTEST_PROFILE: ci
  CAP_VERIFY_LOCKED: "1"

jobs:
  ab:
    name: full macOS fast suite x6 at ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: 5e9aef48f2a060f423c7908f49b4e7685de0fb4d
          - label: vt-group
            ref: 7205c07d2ee1c4f3813006118e1c2dc89ce8bf7e
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: fast
      - name: Build
        run: scripts/verify/run.sh fast --no-run
      - name: Prepare fixtures
        run: scripts/verify/run.sh fast --prepare-fixtures --no-run || true
      - name: Six full runs
        shell: bash
        run: |
          fails=0
          for i in $(seq 6); do
            export CAP_VERIFY_REPORT_DIR="$RUNNER_TEMP/report-$i"
            if scripts/verify/run.sh fast > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              echo "run $i pass"
            else
              fails=$((fails + 1))
              echo "run $i FAIL: $(grep -ohE 'decoders returned no frame[^\"]*|case [^ ]+ failed' "$RUNNER_TEMP/run-$i.log" | sort -u | tr '\n' ';')"
            fi
          done
          echo "${{ matrix.label }}: $fails of 6 full runs failed"
